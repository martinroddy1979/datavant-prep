[project]
name = "datavant-prep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.12",
    "structlog>=25.5.0",
]
[tool.ruff]
# Target version for the latest Python features
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Select rules: 
# E = Error, F = Pyflakes, I = Isort (Imports), UP = Pyupgrade
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
