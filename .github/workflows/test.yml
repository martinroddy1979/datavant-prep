name: Testing and Quality Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1: Focuses strictly on code style and formatting
  linting:
    runs-on: ubuntu-latest
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Run Ruff Linter
      run: uv run ruff check .

  # JOB 2: Focuses strictly on executing the validation and privacy engine tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Run Pytest Suite
      env:
        SHARED_SECRET_SALT: "ci-testing-secret-key-2026"
      run: uv run pytest